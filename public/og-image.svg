<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Fondo Degradado Guinda Elegante -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A0013"/>
      <stop offset="50%" stop-color="#800020"/>
      <stop offset="100%" stop-color="#2D000B"/>
    </linearGradient>

    <!-- Sombra para la tarjeta -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000" flood-opacity="0.45"/>
    </filter>

    <!-- Patrón sutil para el fondo -->
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="#FFFDF9" opacity="0.08"/>
    </pattern>
  </defs>

  <!-- 1. Fondo de la Imagen -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#gridPattern)"/>

  <!-- Brillos decorativos de fondo -->
  <circle cx="1050" cy="100" r="300" fill="#B31238" opacity="0.25" filter="blur(60px)"/>
  <circle cx="150" cy="530" r="250" fill="#FFFDF9" opacity="0.05" filter="blur(50px)"/>

  <!-- 2. Tarjeta / Ticket Principal de Rifa -->
  <g filter="url(#dropShadow)" transform="translate(60, 95)">
    <!-- Cuerpo de la Tarjeta -->
    <rect x="0" y="0" width="1080" height="440" rx="28" fill="#FFFDF9"/>

    <!-- Franja Superior Bordó decorativa -->
    <path d="M 0 28 A 28 28 0 0 1 28 0 L 1052 0 A 28 28 0 0 1 1080 28 L 1080 16 L 0 16 Z" fill="#800020"/>

    <!-- Muescas / Troquelados laterales de boleto -->
    <circle cx="0" cy="220" r="32" fill="#580218"/>
    <circle cx="1080" cy="220" r="32" fill="#430113"/>

    <!-- Línea punteada de corte estilo ticket -->
    <line x1="320" y1="30" x2="320" y2="410" stroke="#EBE3D5" stroke-width="4" stroke-dasharray="12,12"/>

    <!-- SECCIÓN IZQUIERDA: Talón de Control -->
    <g transform="translate(40, 50)">
      <rect x="0" y="0" width="220" height="340" rx="16" fill="#FAF6F0"/>
      
      <!-- Sello 'EGRESADOS' -->
      <rect x="25" y="30" width="170" height="36" rx="8" fill="#800020" opacity="0.1"/>
      <text x="110" y="54" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="16" fill="#800020" text-anchor="middle" letter-spacing="3">EGRESADOS</text>

      <!-- Isologotipo 'G' Gigante -->
      <text x="110" y="210" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="130" fill="#800020" text-anchor="middle">G</text>
      
      <text x="110" y="280" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="28" fill="#3A2D28" text-anchor="middle">GRILLI</text>
      <text x="110" y="310" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="20" fill="#800020" text-anchor="middle">PROMO '26</text>
    </g>

    <!-- SECCIÓN DERECHA: Datos de la Rifa -->
    <g transform="translate(370, 70)">
      <!-- Badge 'Oficial' -->
      <rect x="0" y="0" width="180" height="32" rx="16" fill="#800020" opacity="0.1"/>
      <text x="90" y="21" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="13" fill="#800020" text-anchor="middle" letter-spacing="2">PLATAFORMA OFICIAL</text>

      <!-- Título Principal -->
      <text x="0" y="85" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="58" fill="#3A2D28">RIFA DE EGRESADOS</text>
      
      <!-- Subtítulo / Colegio -->
      <text x="0" y="135" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="34" fill="#800020">Instituto Grilli • Sorteo 2026</text>

      <!-- Descripción ajustada a la realidad -->
      <text x="0" y="195" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="22" fill="#7C6E65">Consulta en tiempo real el estado de los números</text>
      <text x="0" y="225" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="22" fill="#7C6E65">y contacta al estudiante asignado para comprar el tuyo.</text>

      <!-- Botón Informativo -->
      <g transform="translate(0, 260)">
        <rect x="0" y="0" width="280" height="50" rx="14" fill="#800020"/>
        <text x="140" y="32" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="18" fill="#FFFDF9" text-anchor="middle">VER GRILLA EN VIVO →</text>
      </g>
    </g>
  </g>
</svg>
