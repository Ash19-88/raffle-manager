<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Fondo redondeado con el tono guinda/borra de vino -->
  <rect width="512" height="512" rx="128" fill="#800020" />
  
  <!-- Ticket de Rifa Estilizado -->
  <g transform="translate(256, 210) rotate(-10) translate(-140, -90)">
    <rect x="0" y="0" width="280" height="180" rx="20" fill="#FFFDF9" />
    
    <!-- Muescas de ticket -->
    <circle cx="0" cy="90" r="18" fill="#800020" />
    <circle cx="280" cy="90" r="18" fill="#800020" />
    
    <!-- Línea punteada de corte -->
    <line x1="80" y1="20" x2="80" y2="160" stroke="#EFE8DC" stroke-width="4" stroke-dasharray="8,8" />
    
    <!-- Detalle de ícono ticket interno -->
    <circle cx="40" cy="90" r="12" fill="#800020" opacity="0.2" />
    <text x="180" y="110" font-family="system-ui, sans-serif" font-weight="900" font-size="64" fill="#800020" text-anchor="middle">G</text>
  </g>

  <!-- Texto de la Promoción '26 -->
  <text x="256" y="420" font-family="system-ui, sans-serif" font-weight="900" font-size="72" fill="#FFFDF9" text-anchor="middle" letter-spacing="2">
    '26
  </text>
</svg>
